<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UniChoice</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #fff5fa, #fce4ef);
  color: #594253;
}

header {
  padding: 25px 8%;
  font-size: 23px;
  font-weight: bold;
  color: #d66b9b;
}

main {
  text-align: center;
  padding: 100px 20px;
}

h1 {
  font-size: 48px;
  margin-bottom: 20px;
  color: #d66b9b;
}

.subtitle {
  font-size: 19px;
  color: #92788a;
  margin-bottom: 45px;
}

.welcome {
  font-size: 27px;
  margin-bottom: 18px;
}

.description {
  font-size: 16px;
  line-height: 1.8;
  color: #92788a;
  max-width: 550px;
  margin: 0 auto;
}

.decor {
  position: fixed;
  font-size: 25px;
  opacity: 0.6;
  pointer-events: none;
}

.decor1 {
  top: 25%;
  left: 10%;
}

.decor2 {
  top: 35%;
  right: 12%;
}

.decor3 {
  bottom: 20%;
  left: 15%;
}

.decor4 {
  bottom: 25%;
  right: 10%;
}

footer {
  text-align: center;
  padding: 25px;
  color: #b18ca2;
  font-size: 13px;
}

df-messenger {
  --df-messenger-button-titlebar-color: #d66b9b;
  --df-messenger-button-titlebar-font-color: #ffffff;
  --df-messenger-chat-background-color: #fffafd;
  --df-messenger-font-color: #594253;
  --df-messenger-send-icon: #d66b9b;
  --df-messenger-user-message: #f8d9e8;
  --df-messenger-bot-message: #fff0f6;
}

@media (max-width: 600px) {
  main {
    padding: 75px 20px;
  }

  h1 {
    font-size: 36px;
  }

  .welcome {
    font-size: 23px;
  }

  .decor {
    font-size: 20px;
  }
}
</style>
</head>

<body>

<header>
  ♡ UniChoice
</header>

<div class="decor decor1">🎀</div>
<div class="decor decor2">♡</div>
<div class="decor decor3">✨</div>
<div class="decor decor4">🌸</div>

<main>

  <h1>UniChoice</h1>

  <p class="subtitle">
    Your Personal University Choice Assistant
  </p>

  <h2 class="welcome">
    Xin chào! Mình là UniChoice 💗
  </h2>

  <p class="description">
    Trợ lý đồng hành cùng bạn trong hành trình khám phá
    thông tin và định hướng lựa chọn.
    <br>
    Hãy nhấn biểu tượng chat ở góc dưới bên phải
    để bắt đầu nhé!
  </p>

</main>

<footer>
  UniChoice · Chatbot Demo
</footer>

<script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>

<df-messenger
  intent="WELCOME"
  chat-title="UniChoice"
  agent-id="e95e3c28-e9a1-4acb-88d9-1a3bcdacea54"
  language-code="vi">
</df-messenger>

</body>
</html>
